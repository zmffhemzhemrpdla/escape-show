<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>도망자 쇼</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#9fd0ea;
    font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    touch-action:none;-webkit-user-select:none;user-select:none;color:#fff;}
  canvas{display:block;}
  .ov{position:fixed;pointer-events:none;z-index:10;}
  #top{top:max(8px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:8px;}
  .pill{background:rgba(20,26,40,.72);border-radius:12px;padding:6px 14px;font-size:15px;font-weight:800;}
  #timer{color:#ffe08a;}
  #roleCard{top:calc(max(8px,env(safe-area-inset-top)) + 42px);left:50%;transform:translateX(-50%);
    border-radius:14px;padding:6px 16px;font-size:14px;font-weight:800;background:rgba(20,26,40,.8);white-space:nowrap;}
  #pdBanner{top:34%;left:50%;transform:translate(-50%,-50%);text-align:center;max-width:88vw;
    background:rgba(30,24,60,.86);border:2px solid #7d6bd6;border-radius:16px;padding:14px 22px;
    font-size:18px;font-weight:800;opacity:0;transition:opacity .3s;box-shadow:0 6px 30px rgba(0,0,0,.4);}
  #pdBanner small{display:block;font-size:13px;font-weight:600;color:#c9bef0;margin-top:3px;}
  #pdLog{bottom:calc(max(8px,env(safe-area-inset-bottom)) + 6px);left:10px;font-size:12.5px;line-height:1.5;
    max-width:60vw;color:#fff;text-shadow:0 1px 3px #000;}
  #pdLog b{color:#ffd36a;}
  #joyBase{position:fixed;width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.14);
    border:2px solid rgba(255,255,255,.4);display:none;z-index:11;}
  #joyThumb{position:fixed;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.5);display:none;z-index:12;}
  #actBtn{position:fixed;right:24px;bottom:120px;width:88px;height:88px;border-radius:50%;border:none;
    background:rgba(255,210,110,.9);color:#4a3410;font-weight:900;font-size:15px;z-index:12;display:none;
    box-shadow:0 3px 8px rgba(0,0,0,.3);}
  #actBtn:active{transform:scale(.94);}
  .screen{position:fixed;inset:0;z-index:30;background:rgba(20,28,48,.55);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;}
  .card{background:#fbf7ee;color:#3a3320;border-radius:22px;padding:24px 28px;max-width:440px;margin:16px;
    text-align:center;box-shadow:0 12px 44px rgba(0,0,0,.4);}
  .card h1{margin:0 0 4px;font-size:28px;}
  .card p.sub{margin:0 0 14px;color:#8a7c58;font-size:14px;}
  .help{text-align:left;font-size:13.5px;line-height:1.75;background:#efe9d8;border-radius:12px;padding:12px 16px;margin-bottom:16px;color:#5f5535;}
  .row{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0;font-size:15px;font-weight:700;}
  .row button{border:none;background:#e7e0cd;width:34px;height:34px;border-radius:10px;font-size:20px;font-weight:900;cursor:pointer;}
  .big{border:none;color:#fff;font-size:19px;font-weight:800;padding:12px 40px;border-radius:999px;cursor:pointer;}
  #playBtn{background:#e0713a;box-shadow:0 4px 0 #b4551f;}
  #playBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b4551f;}
  .choice{display:inline-block;margin:3px;padding:8px 14px;border-radius:999px;border:2px solid #d8cfb6;background:#fff;
    font-weight:800;font-size:14px;cursor:pointer;color:#6a5f3a;}
  .choice.on{border-color:#e0713a;background:#ffe9dc;color:#c1571f;}
  #resultTitle{font-size:30px;margin:0 0 6px;}
</style>
</head>
<body>
<div id="top" class="ov">
  <div class="pill" id="timer">⏱ 90</div>
  <div class="pill" id="alive">🏃 0</div>
  <div class="pill" id="mission">📋 대기</div>
</div>
<div id="roleCard" class="ov">역할: -</div>
<div id="pdBanner" class="ov"></div>
<div id="pdLog" class="ov"></div>

<div id="joyBase"></div><div id="joyThumb"></div>
<button id="actBtn">액션</button>

<div id="splash" class="screen">
  <div class="card">
    <h1>🎭 도망자 쇼</h1>
    <p class="sub">3D 마을 광장에서 펼쳐지는 추격 서바이벌 — PD의 미션을 수행하며 살아남아라!</p>
    <div class="help" id="help"></div>
    <div class="row">인원 <button id="pMinus">−</button><span id="pCount">6</span><button id="pPlus">+</button> 명 (봇 포함)</div>
    <div class="row" style="flex-direction:column;gap:6px;">
      <div style="font-size:13px;color:#8a7c58;">나의 희망 역할</div>
      <div>
        <span class="choice on" data-pref="auto">🎲 랜덤</span>
        <span class="choice" data-pref="runner">🏃 도망자</span>
        <span class="choice" data-pref="hunter">👹 헌터</span>
      </div>
    </div>
    <button id="playBtn" class="big" disabled>불러오는 중…</button>
  </div>
</div>

<div id="result" class="screen" style="display:none;">
  <div class="card">
    <h1 id="resultTitle">결과</h1>
    <p class="sub" id="resultSub"></p>
    <div class="help" id="resultDetail" style="text-align:center;"></div>
    <button id="againBtn" class="big" style="background:#5aa04a;box-shadow:0 4px 0 #3d7830;">다시 (역할 재배정)</button>
  </div>
</div>

<script>
window.addEventListener('error', function(e){ var el=document.getElementById('help'); if(el&&!window.__loaded) el.textContent='⚠️ 오류: '+(e.message||'?'); });
</script>
<script type="module">
import * as THREE from './three.module.min.js';

// ================= 도망자 쇼 v2 — 3D 마을 광장 =================
// 상태(x,z 평면)와 렌더(3D)를 분리. 게임 로직은 2D 검증본을 3D 좌표로 이식.

const AW=64, AD=44, R=0.5, CATCH=1.0;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.insertBefore(renderer.domElement, document.body.firstChild);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x9fd0ea); scene.fog=new THREE.Fog(0x9fd0ea,55,110);
const camera=new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 300);
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
scene.add(new THREE.HemisphereLight(0xffffff,0x8faa77,0.95));
const sun=new THREE.DirectionalLight(0xfff2d8,1.05); sun.position.set(30,50,20); sun.castShadow=true;
sun.shadow.mapSize.set(1536,1536); sun.shadow.camera.left=-50; sun.shadow.camera.right=50; sun.shadow.camera.top=50; sun.shadow.camera.bottom=-50; sun.shadow.camera.far=140;
scene.add(sun); scene.add(new THREE.AmbientLight(0xffffff,0.28));

// ---- 장애물 정의 (x,z AABB / 분수 원) — 건물은 들어갈 수 있음 ----
const buildings=[
  {x0:5,z0:4,x1:17,z1:13, door:'S', roof:0xe08a5a, wall:0xf3ddc0, floor:0xdcc39c, name:'🍞 빵집', kind:'bakery'},
  {x0:47,z0:4,x1:59,z1:13, door:'S', roof:0x5f92d6, wall:0xd9e6f4, floor:0xc7d4e2, name:'☕ 카페', kind:'cafe'},
  {x0:5,z0:31,x1:17,z1:40, door:'N', roof:0x6cb85e, wall:0xdcedcc, floor:0xc9dcb8, name:'🌸 꽃집', kind:'flower'},
  {x0:47,z0:31,x1:59,z1:40, door:'N', roof:0xb98ae0, wall:0xeaddf7, floor:0xd8c9ee, name:'🎪 잡화점', kind:'store'},
];
const hedges=[{x0:23.5,z0:16,x1:24.7,z1:20.5},{x0:39.3,z0:16,x1:40.5,z1:20.5}];
const fountain={x:32,z:22,r:3};
const jail={x0:27,z0:1.5,x1:37,z1:5.5};
const boxes=[]; // 충돌 AABB (벽·카운터·울타리) — 환경 빌드 시 채움
function hitsWall(x,z,r){
  if(x<r||z<r||x>AW-r||z>AD-r) return true;
  for(const b of boxes){ if(x>b.x0-r && x<b.x1+r && z>b.z0-r && z<b.z1+r) return true; }
  const dx=x-fountain.x, dz=z-fountain.z; if(dx*dx+dz*dz < (fountain.r+r)*(fountain.r+r)) return true;
  return false;
}
function inJail(x,z){ return x>jail.x0-1&&x<jail.x1+1&&z>jail.z0-1&&z<jail.z1+1; }

// ---- 환경 3D 빌드 ----
function box(w,h,d,color,x,y,z,cast){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshLambertMaterial({color})); m.position.set(x,y,z); if(cast!==false){m.castShadow=true;} m.receiveShadow=true; scene.add(m); return m; }
function cyl(rt,rb,h,color,x,y,z,cast){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,14), new THREE.MeshLambertMaterial({color})); m.position.set(x,y,z); if(cast!==false)m.castShadow=true; m.receiveShadow=true; scene.add(m); return m; }
function ball(r,color,x,y,z){ const m=new THREE.Mesh(new THREE.SphereGeometry(r,10,8), new THREE.MeshLambertMaterial({color})); m.position.set(x,y,z); scene.add(m); return m; }
function collideBox(x0,z0,x1,z1){ boxes.push({x0,z0,x1,z1}); }
// 잔디 바닥
const ground=new THREE.Mesh(new THREE.PlaneGeometry(AW,AD), new THREE.MeshLambertMaterial({color:0x8fc06e}));
ground.rotation.x=-Math.PI/2; ground.position.set(AW/2,0,AD/2); ground.receiveShadow=true; scene.add(ground);
// 광장 + 길
const plaza=new THREE.Mesh(new THREE.CircleGeometry(15,44), new THREE.MeshLambertMaterial({color:0xe6d9bd}));
plaza.rotation.x=-Math.PI/2; plaza.position.set(32,0.02,22); plaza.receiveShadow=true; scene.add(plaza);
for(const [w,d] of [[3.6,42],[56,3.6]]){ const road=new THREE.Mesh(new THREE.PlaneGeometry(w,d), new THREE.MeshLambertMaterial({color:0xd7d2c2})); road.rotation.x=-Math.PI/2; road.position.set(32,0.01,22); scene.add(road); }
// 분수 (2단 + 물줄기)
cyl(fountain.r+0.5,fountain.r+0.7,0.7,0xcbbf9e,fountain.x,0.35,fountain.z);
cyl(fountain.r,fountain.r,0.55,0x6fc3e0,fountain.x,0.5,fountain.z,false);
cyl(1.7,1.9,1.0,0xcbbf9e,fountain.x,1.0,fountain.z);
cyl(1.4,1.4,0.4,0x8fd0e8,fountain.x,1.55,fountain.z,false);
cyl(0.35,0.45,1.2,0xcbbf9e,fountain.x,2.1,fountain.z);
ball(0.5,0xbfe8f5,fountain.x,2.9,fountain.z);

// 건물 (벽+문+지붕+바닥+가구, 들어갈 수 있음)
const bldgLabels=[];
function buildWalls(b){ const {x0,z0,x1,z1,wall}=b; const t=0.4, H=3, gap=2.6, cx=(x0+x1)/2, cz=(z0+z1)/2;
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(x1-x0,z1-z0), new THREE.MeshLambertMaterial({color:b.floor})); fl.rotation.x=-Math.PI/2; fl.position.set(cx,0.04,cz); fl.receiveShadow=true; scene.add(fl);
  box(t,H,z1-z0,wall,x0,H/2,cz); collideBox(x0-t/2,z0,x0+t/2,z1);
  box(t,H,z1-z0,wall,x1,H/2,cz); collideBox(x1-t/2,z0,x1+t/2,z1);
  for(const side of ['N','S']){ const zz=side==='N'?z0:z1;
    if(b.door===side){ box((cx-gap/2)-x0,H,t,wall,(x0+cx-gap/2)/2,H/2,zz); collideBox(x0,zz-t/2,cx-gap/2,zz+t/2);
      box(x1-(cx+gap/2),H,t,wall,(cx+gap/2+x1)/2,H/2,zz); collideBox(cx+gap/2,zz-t/2,x1,zz+t/2);
      box(gap,0.6,t,b.roof,cx,H-0.3,zz,false); }
    else { box(x1-x0,H,t,wall,cx,H/2,zz); collideBox(x0,zz-t/2,x1,zz+t/2); } }
  const roof=new THREE.Mesh(new THREE.ConeGeometry(Math.max(x1-x0,z1-z0)*0.78,2.4,4), new THREE.MeshLambertMaterial({color:b.roof}));
  roof.position.set(cx,H+1.2,cz); roof.rotation.y=Math.PI/4; roof.castShadow=true; scene.add(roof); b.roofMesh=roof;
  bldgLabels.push({x:cx,y:H+2.6,z:cz,text:b.name});
}
function furnish(b){ const cx=(b.x0+b.x1)/2, cz=(b.z0+b.z1)/2, bw=b.x1-b.x0;
  const backZ=b.door==='S'?b.z0+1:b.z1-1, frontZ=b.door==='S'?b.z1-2.2:b.z0+2.2;
  if(b.kind==='cafe'){
    box(bw-2,1,0.9,0x8a6a48,cx,0.6,backZ); collideBox(cx-(bw-2)/2,backZ-0.45,cx+(bw-2)/2,backZ+0.45);
    box(0.7,0.7,0.6,0x6a6a72,cx-2.4,1.35,backZ); box(0.5,0.6,0.4,0xd0d0d8,cx+2.4,1.3,backZ); // 커피머신·컵
    box(1.8,1.0,0.08,0x5a4a3a,cx+3,2.1,b.door==='S'?b.z0+0.28:b.z1-0.28); // 메뉴판
    for(const [tx,tz] of [[cx-2.6,frontZ],[cx+2.6,frontZ],[cx,cz]]){ cyl(0.55,0.55,0.85,0xb98a5a,tx,0.42,tz); cyl(0.62,0.62,0.1,0xd8b078,tx,0.9,tz,false);
      for(const s of [-1,1]) cyl(0.26,0.26,0.5,0x7a5a8a,tx+s*1.0,0.25,tz); }
    cyl(0.5,0.6,0.6,0xb87a4a,b.x0+1,0.3,frontZ); ball(0.6,0x5fa04a,b.x0+1,1.0,frontZ); // 화분
  } else if(b.kind==='bakery'){
    box(bw-3,1,1,0xb98a5a,cx,0.6,frontZ); collideBox(cx-(bw-3)/2,frontZ-0.5,cx+(bw-3)/2,frontZ+0.5);
    for(let i=-2;i<=2;i++){ const br=ball(0.28,0xd39a5a,cx+i*0.9,1.2,frontZ); br.scale.set(1.3,0.8,1); }
    box(bw-2,0.28,0.6,0xa07a4a,cx,2.2,backZ,false); box(bw-2,0.28,0.6,0xa07a4a,cx,1.5,backZ,false);
    for(let i=-2;i<=2;i++){ ball(0.22,0xc98a4a,cx+i*0.9,1.72,backZ); ball(0.22,0xd8a85a,cx+i*0.9,2.42,backZ); }
    box(1.4,1.6,1.0,0x777782,b.x1-1.4,0.8,backZ); // 오븐
  } else if(b.kind==='flower'){
    for(const [fx,fz,col] of [[b.x0+1.6,frontZ,0xf2789f],[cx,frontZ,0xffd36a],[b.x1-1.6,frontZ,0xc79bff],[b.x0+1.6,backZ,0xff9ec4],[b.x1-1.6,backZ,0x8fd0e8]]){
      cyl(0.4,0.5,0.7,0x9a6a4a,fx,0.35,fz); for(let k=0;k<6;k++){ const a=k/6*6.28; ball(0.18,col,fx+Math.cos(a)*0.25,0.85,fz+Math.sin(a)*0.25); } ball(0.16,0x6cb356,fx,0.8,fz); }
    box(bw-3,0.9,0.9,0x8a6a48,cx,0.5,cz); collideBox(cx-(bw-3)/2,cz-0.45,cx+(bw-3)/2,cz+0.45);
  } else { // 잡화점
    for(const sx of [b.x0+1.3,b.x1-1.3]){ box(1.4,2.2,b.z1-b.z0-2.4,0xa8895a,sx,1.1,cz); collideBox(sx-0.7,b.z0+1.2,sx+0.7,b.z1-1.2);
      for(let j=0;j<4;j++) for(const s of [-1,1]) box(0.5,0.5,0.5,[0xff9ec4,0x8fd0e8,0xffd36a,0x9fd18a][j],sx,0.6+j*0.55,cz+s*1.4,false); }
    box(0.8,0.7,0.8,0xb98a5a,cx,0.35,frontZ); box(0.8,0.7,0.8,0xb98a5a,cx-1.5,0.35,frontZ);
  }
}
for(const b of buildings){ buildWalls(b); furnish(b); }

// 울타리
for(const h of hedges){ box(h.x1-h.x0,1.1,h.z1-h.z0,0x5b9e4a,(h.x0+h.x1)/2,0.55,(h.z0+h.z1)/2); collideBox(h.x0,h.z0,h.x1,h.z1); }
// 시장 가판대
function stall(x,z,canopy){ const g=new THREE.Group();
  for(const [sx,sz] of [[-1.4,-0.9],[1.4,-0.9],[-1.4,0.9],[1.4,0.9]]){ const p=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,2,6),new THREE.MeshLambertMaterial({color:0x8a6a48})); p.position.set(sx,1,sz); g.add(p); }
  const c=new THREE.Mesh(new THREE.BoxGeometry(3,0.7,1.8),new THREE.MeshLambertMaterial({color:0xb98a5a})); c.position.y=0.7; c.castShadow=true; g.add(c);
  for(let i=0;i<4;i++){ const it=new THREE.Mesh(new THREE.SphereGeometry(0.22,8,6),new THREE.MeshLambertMaterial({color:[0xff6a6a,0xffd36a,0x9fd18a,0xf2789f][i]})); it.position.set(-1+i*0.7,1.2,0); g.add(it); }
  const cp=new THREE.Mesh(new THREE.BoxGeometry(3.4,0.2,2.2),new THREE.MeshLambertMaterial({color:canopy})); cp.position.y=2.15; cp.castShadow=true; g.add(cp);
  g.position.set(x,0,z); scene.add(g); }
stall(24,26,0xe0713a); stall(40,18,0x5f92d6);
// 벤치
function bench(x,z,rot){ const g=new THREE.Group(); const wm=new THREE.MeshLambertMaterial({color:0xa9773f});
  const seat=new THREE.Mesh(new THREE.BoxGeometry(2,0.15,0.7),wm); seat.position.y=0.5; seat.castShadow=true; g.add(seat);
  const back=new THREE.Mesh(new THREE.BoxGeometry(2,0.6,0.12),wm); back.position.set(0,0.85,-0.3); g.add(back);
  for(const s of [-0.8,0.8]){ const leg=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.5,0.6),new THREE.MeshLambertMaterial({color:0x7a5230})); leg.position.set(s,0.25,0); g.add(leg); }
  g.position.set(x,0,z); g.rotation.y=rot; scene.add(g); }
bench(27,26,0); bench(37,26,0); bench(26,18,Math.PI/2); bench(38,18,Math.PI/2);
// 화분
function planter(x,z){ cyl(0.55,0.7,0.7,0xc98a5a,x,0.35,z); for(let k=0;k<5;k++){ const a=k/5*6.28; ball(0.2,[0xf2789f,0xffd36a,0xc79bff][k%3],x+Math.cos(a)*0.3,0.85,z+Math.sin(a)*0.3); } }
for(const [x,z] of [[20,17],[44,27],[20,27],[44,17]]) planter(x,z);
// 나무 (2겹)
const trunkGeo=new THREE.CylinderGeometry(0.24,0.32,1.5,7), trunkMat=new THREE.MeshLambertMaterial({color:0x8a5f34});
for(const [x,z,s] of [[4,22,1.1],[4,40,1],[20,3,0.9],[44,3,0.95],[32,42,1.2],[60,22,1.1],[60,40,1],[13,42,0.9],[51,42,0.95],[9,22,0.9],[55,22,0.9]]){
  const t=new THREE.Mesh(trunkGeo,trunkMat); t.position.set(x,0.75,z); t.castShadow=true; scene.add(t);
  const l1=new THREE.Mesh(new THREE.SphereGeometry(1.5*s,10,8),new THREE.MeshLambertMaterial({color:0x5fa04a})); l1.position.set(x,2.1,z); l1.castShadow=true; scene.add(l1);
  ball(1.1*s,0x6cb356,x,2.9,z); }
// 가로등
for(const [x,z] of [[20,20],[44,20],[20,26],[44,26],[32,13],[32,31]]){ box(0.16,2.4,0.16,0x5a5348,x,1.2,z,false); ball(0.3,0xffe9a8,x,2.6,z).material=new THREE.MeshBasicMaterial({color:0xffe9a8}); }
// 방송 무대
box(11,0.6,4,0x4a3f6a,32,0.3,10); box(10,0.4,3,0x6a5aa0,32,0.65,10,false); box(0.3,3,0.3,0x333333,26.5,1.8,10,false); box(0.3,3,0.3,0x333333,37.5,1.8,10,false);

function rand(a,b){ return a+Math.random()*(b-a); }
function d2(a,b){ const dx=a.x-b.x,dz=a.z-b.z; return dx*dx+dz*dz; }

function makeChar(color,isHunter){
  const g=new THREE.Group();
  const bodyMat=new THREE.MeshLambertMaterial({color:isHunter?0xe05a5a:color});
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.5,16,14), bodyMat); body.scale.set(1,1.05,1); body.position.y=0.55; body.castShadow=true; g.add(body);
  // 눈 (+z 정면)
  const w=new THREE.MeshBasicMaterial({color:0xffffff}), k=new THREE.MeshBasicMaterial({color:0x222222});
  for(const s of [-1,1]){ const e=new THREE.Mesh(new THREE.SphereGeometry(0.11,10,8),w); e.position.set(s*0.17,0.66,0.42); g.add(e);
    const p=new THREE.Mesh(new THREE.SphereGeometry(0.055,8,6),k); p.position.set(s*0.17,0.66,0.5); g.add(p); }
  if(isHunter){ const hm=new THREE.MeshLambertMaterial({color:0xb83a3a}); for(const s of [-1,1]){ const horn=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.34,7),hm); horn.position.set(s*0.22,1.02,0); g.add(horn); } }
  g.userData.bodyMat=bodyMat; return g;
}

// ---- 역할 배정 ----
function assignRoles(){
  const n=S.players.length; const hunters=n<=4?1:n<=7?2:3; const hasSpy=n>=4;
  const me=S.players[S.myId]; const ids=S.players.map(p=>p.id); const hset=new Set();
  if(pref==='hunter') hset.add(me.id);
  const pool=ids.filter(id=>id!==me.id||pref==='auto');
  while(hset.size<hunters){ if(pool.every(id=>hset.has(id))) break; hset.add(pool[Math.floor(Math.random()*pool.length)]); }
  let spyId=-1; if(hasSpy){ const rs=ids.filter(id=>!hset.has(id)); spyId=rs[Math.floor(Math.random()*rs.length)]; }
  for(const p of S.players){ p.role=hset.has(p.id)?'hunter':'runner'; p.spy=(p.id===spyId); p.alive=true; p.jailed=false; p.jailT=0; p.invuln=1.2; p.everCaught=false;
    if(p.role==='hunter'){ p.x=32; p.z=AD-3; } else { const s=spawnPos(); p.x=s.x; p.z=s.z; } }
}

const keys={}; let camYaw=0, camPitch=0.55, dragId=-1, lastX=0, lastY=0;
const clampP=v=>Math.max(0.22,Math.min(1.15,v));
addEventListener('keydown',e=>{ keys[e.code]=true; if(e.code==='Space'){e.preventDefault(); doAction();} if(e.code==='KeyQ') camYaw+=0.12; if(e.code==='KeyE') camYaw-=0.12; if(e.code==='KeyR') camPitch=clampP(camPitch+0.08); if(e.code==='KeyF') camPitch=clampP(camPitch-0.08); });
addEventListener('keyup',e=>{ keys[e.code]=false; });
const joy={active:false,id:-1,ox:0,oy:0,x:0,y:0};
const joyBase=document.getElementById('joyBase'), joyThumb=document.getElementById('joyThumb');
renderer.domElement.addEventListener('touchstart',e=>{ e.preventDefault();
  for(const t of e.changedTouches){ if(!joy.active && t.clientX<innerWidth*0.5){ joy.active=true; joy.id=t.identifier; joy.ox=t.clientX; joy.oy=t.clientY; joy.x=0; joy.y=0;
    joyBase.style.display='block'; joyBase.style.left=(t.clientX-59)+'px'; joyBase.style.top=(t.clientY-59)+'px';
    joyThumb.style.display='block'; joyThumb.style.left=(t.clientX-25)+'px'; joyThumb.style.top=(t.clientY-25)+'px'; }
    else if(dragId===-1){ dragId=t.identifier; lastX=t.clientX; lastY=t.clientY; } }
},{passive:false});
renderer.domElement.addEventListener('touchmove',e=>{ e.preventDefault();
  for(const t of e.changedTouches){ if(t.identifier===joy.id){ let dx=t.clientX-joy.ox, dy=t.clientY-joy.oy; const l=Math.hypot(dx,dy),m=48; if(l>m){dx*=m/l;dy*=m/l;}
    joy.x=dx/m; joy.y=dy/m; joyThumb.style.left=(joy.ox+dx-25)+'px'; joyThumb.style.top=(joy.oy+dy-25)+'px'; }
    else if(t.identifier===dragId){ camYaw-=(t.clientX-lastX)*0.006; camPitch=clampP(camPitch+(t.clientY-lastY)*0.005); lastX=t.clientX; lastY=t.clientY; } }
},{passive:false});
function endT(e){ for(const t of e.changedTouches){ if(t.identifier===joy.id){ joy.active=false; joy.id=-1; joy.x=0; joy.y=0; joyBase.style.display='none'; joyThumb.style.display='none'; } else if(t.identifier===dragId) dragId=-1; } }
renderer.domElement.addEventListener('touchend',endT); renderer.domElement.addEventListener('touchcancel',endT);
document.getElementById('actBtn').addEventListener('touchstart',e=>{ e.preventDefault(); e.stopPropagation(); doAction(); },{passive:false});

// ---- 액션 ----
function doAction(){ const me=S.players[S.myId]; if(!me||!me.alive||me.jailed||S.phase!=='play'||me.role!=='runner') return;
  for(const p of S.players){ if(p.jailed&&p.alive&&d2(me,p)<9){ freeFromJail(p,me); return; } }
  for(const sw of switches){ if(d2(me,sw)<4){ if(me.spy){ if(sw.on){ sw.on=false; pdLog(me.name+'이(가) 미션을 방해했다?!'); } } else if(!sw.on){ sw.on=true; pdLog('미션 포인트 작동! ('+switches.filter(s=>s.on).length+'/3)'); checkMission(); } return; } }
}
function freeFromJail(p,by){ p.jailed=false; p.jailT=0; p.invuln=2; const s=spawnPos(); p.x=s.x; p.z=s.z; pdBig('🔓 구출!',(by?by.name:'누군가')+'이(가) '+p.name+'을(를) 구했다'); pdLog(p.name+' 구출!'); }
function checkMission(){ if(S.missionDone) return; if(switches.every(s=>s.on)){ S.missionDone=true; S.missionActive=false; S.freezeT=6;
  pdBig('✅ 팀 미션 성공!','헌터 6초 정지! 지금이 기회다'); pdLog('팀 미션 성공 → 헌터 정지!'); document.getElementById('mission').textContent='📋 성공!'; } }

// ---- 잡기/감옥 ----
function jailPlayer(p,by){ if(p.jailed||p.invuln>0) return;
  if(!p.everCaught){ p.everCaught=true; p.jailed=true; p.jailT=14; p.x=rand(jail.x0+1,jail.x1-1); p.z=rand(jail.z0+1,jail.z1-1);
    pdBig('🚨 체포!',p.name+'이(가) 감옥으로! 동료가 구할 수 있다'); pdLog((by?by.name:'헌터')+'이(가) '+p.name+' 체포'); }
  else eliminate(p,'두 번째 체포'); }
function eliminate(p,why){ p.alive=false; p.jailed=false; if(p.mesh) p.mesh.visible=false; if(p.label) p.label.visible=false; pdBig('💥 탈락!',p.name+' ('+why+')'); pdLog(p.name+' 완전 탈락 ('+why+')'); }

// ---- 봇 AI ----
function botThink(p,dt){ p.botTimer-=dt;
  const runners=S.players.filter(q=>q.alive&&!q.jailed&&q.role==='runner');
  const hunters=S.players.filter(q=>q.alive&&q.role==='hunter'); let ax=0,az=0;
  if(p.role==='hunter'){ if(S.freezeT>0){ p.ivx=0; p.ivz=0; return; } let best=null,bd=1e9; for(const r of runners){ const d=d2(p,r); if(d<bd){bd=d;best=r;} } if(best){ax=best.x-p.x;az=best.z-p.z;} else {ax=rand(-1,1);az=rand(-1,1);} }
  else { let near=null,nd=1e9; for(const h of hunters){ const d=d2(p,h); if(d<nd){nd=d;near=h;} } const flee=nd<100;
    if(flee&&near){ ax=p.x-near.x; az=p.z-near.z; } else {
      if(!p.botTarget||p.botTimer<=0||(p.botTarget&&d2(p,p.botTarget)<4)){ const cand=p.spy?switches.filter(s=>s.on):switches.filter(s=>!s.on); p.botTarget=cand.length?cand[Math.floor(Math.random()*cand.length)]:{x:rand(3,AW-3),z:rand(8,AD-3)}; p.botTimer=rand(1.5,3.5); }
      ax=p.botTarget.x-p.x; az=p.botTarget.z-p.z;
      if(!p.spy){ for(const q of S.players){ if(q.jailed&&q.alive&&d2(p,q)<400){ ax=q.x-p.x; az=q.z-p.z; } } }
    } }
  const l=Math.hypot(ax,az)||1; p.ivx=ax/l; p.ivz=az/l;
  if(p.role==='runner'){ for(const q of S.players){ if(q.jailed&&q.alive&&d2(p,q)<9&&!p.spy) freeFromJail(q,p); } for(const sw of switches){ if(d2(p,sw)<4){ if(p.spy&&sw.on) sw.on=false; else if(!p.spy&&!sw.on){ sw.on=true; checkMission(); } } } }
}

// ---- 갱신 ----
function step(dt){ if(S.phase!=='play') return;
  S.time-=dt; if(S.freezeT>0) S.freezeT-=dt;
  if(!S.missionActive&&!S.missionDone&&S.time<S.dur-6){ S.missionActive=true; pdBig('📋 팀 미션!','광장의 미션 포인트 3곳을 모두 작동 → 헌터 정지'); pdLog('팀 미션 시작: 포인트 3곳'); }
  const me=S.players[S.myId];
  for(const p of S.players){ if(!p.alive) continue; if(p.invuln>0) p.invuln-=dt;
    if(p.jailed){ p.jailT-=dt; if(p.jailT<=0) eliminate(p,'감옥 시간 초과'); continue; }
    let ix=0,iz=0;
    if(p===me&&!p.isBot){ let fx=0,fz=0;
      if(keys.KeyW||keys.ArrowUp) fz-=1; if(keys.KeyS||keys.ArrowDown) fz+=1; if(keys.KeyA||keys.ArrowLeft) fx-=1; if(keys.KeyD||keys.ArrowRight) fx+=1;
      fx+=joy.x; fz+=joy.y; const l=Math.hypot(fx,fz); if(l>1){fx/=l;fz/=l;}
      // 카메라 방향 기준 이동
      // 카메라 기준 이동: 전방 F=(sin,cos), 화면오른쪽 Rt=(-cos,sin)
      const cos=Math.cos(camYaw), sin=Math.sin(camYaw);
      ix = -fx*cos - fz*sin;
      iz =  fx*sin - fz*cos;
    } else { botThink(p,dt); ix=p.ivx||0; iz=p.ivz||0; }
    let spd=p.role==='hunter'?6.4:6.0; if(p.role==='hunter'&&S.freezeT>0) spd=0; if(p.invuln>0&&p.role==='runner') spd*=1.05;
    let nx=p.x+ix*spd*dt; if(!hitsWall(nx,p.z,R)) p.x=nx;
    let nz=p.z+iz*spd*dt; if(!hitsWall(p.x,nz,R)) p.z=nz;
    if(ix||iz){ p.face=Math.atan2(ix,iz); }
  }
  // 잡기
  for(const h of S.players){ if(!h.alive||h.role!=='hunter'||S.freezeT>0) continue; for(const r of S.players){ if(!r.alive||r.jailed||r.role!=='runner'||r.invuln>0) continue; if(d2(h,r)<CATCH*CATCH) jailPlayer(r,h); } }
  // HUD
  document.getElementById('timer').textContent='⏱ '+Math.max(0,Math.ceil(S.time));
  const rr=S.players.filter(p=>p.role==='runner'); const free=rr.filter(p=>p.alive&&!p.jailed);
  document.getElementById('alive').textContent='🏃 '+free.length+'/'+rr.length;
  if(S.missionActive) document.getElementById('mission').textContent='📋 포인트 '+switches.filter(s=>s.on).length+'/3';
  const aliveRunners=S.players.filter(p=>p.alive&&p.role==='runner');
  if(aliveRunners.length===0) endRound('hunter'); else if(S.time<=0) endRound('runner');
}

function endRound(side){ S.phase='over'; S.winner=side; const me=S.players[S.myId];
  const spyWon=side==='hunter'; let title,sub; title=side==='hunter'?'👹 헌터 승리!':'🏃 도망자 승리!'; sub=side==='hunter'?'도망자를 모두 잡았다':'제한시간까지 살아남았다';
  let mine; if(me.spy) mine=spyWon?'🕵️ 스파이(나) 승리! 아무도 몰랐지…':'🕵️ 스파이(나) 패배…'; else if(me.role==='hunter') mine=side==='hunter'?'내(헌터) 승리 🎉':'내(헌터) 패배'; else mine=side==='runner'?(me.alive?'내(도망자) 생존 승리 🎉':'우리 팀 승리! (난 탈락했지만)'):'내(도망자) 패배';
  document.getElementById('resultTitle').textContent=title; document.getElementById('resultSub').textContent=sub;
  const spy=S.players.find(p=>p.spy); document.getElementById('resultDetail').innerHTML=mine+'<br><br>숨어있던 스파이: <b>'+(spy?spy.name:'없음')+'</b>';
  setTimeout(()=>{ document.getElementById('result').style.display='flex'; },1200);
}

// ---- 렌더 ----
const up=new THREE.Vector3(0,1,0);
function render(){
  const me=S.players[S.myId];
  for(const p of S.players){ if(!p.mesh) continue; if(!p.alive){ continue; }
    p.mesh.position.set(p.x, p.jailed?0.05:0, p.z);
    if(p.face!=null) p.mesh.rotation.y = p.face;
    // 정지된 헌터 색
    if(p.role==='hunter') p.mesh.userData.bodyMat.color.set(S.freezeT>0?0x8fb6e0:0xe05a5a);
    if(p.ring) p.ring.position.set(p.x,0.06,p.z);
    if(p.label){ p.label.position.set(p.x,1.5,p.z); }
  }
  updatePads();
  for(const b of buildings){ if(b.roofMesh){ const ins=me&&me.alive&&me.x>b.x0&&me.x<b.x1&&me.z>b.z0&&me.z<b.z1; b.roofMesh.visible=!ins; } }
  // 카메라: 플레이어 뒤+위, camYaw 회전
  const t=me&&me.alive?me:{x:32,z:22};
  const portrait = innerHeight>innerWidth;
  const dist=portrait?9.5:8.2;
  const horiz=Math.cos(camPitch)*dist, vy=Math.sin(camPitch)*dist;
  let cd=horiz; // 카메라가 벽에 가리면 당겨오기 (촘촘 샘플)
  for(let s=0.6;s<horiz;s+=0.22){ if(hitsWall(t.x-Math.sin(camYaw)*s, t.z-Math.cos(camYaw)*s, 0.38)){ cd=Math.max(1.2,s-0.3); break; } }
  const cx=t.x - Math.sin(camYaw)*cd, cz=t.z - Math.cos(camYaw)*cd;
  camera.position.set(cx, Math.max(1.6, 1.3+vy*(cd/horiz)), cz); camera.lookAt(t.x, 1.3, t.z);
  // 액션 버튼
  const btn=document.getElementById('actBtn');
  if(S.phase==='play'&&me&&me.alive&&!me.jailed&&me.role==='runner'&&('ontouchstart' in window)){
    let show=false; for(const p of S.players){ if(p.jailed&&p.alive&&d2(me,p)<9) show=true; } for(const sw of switches){ if(d2(me,sw)<4) show=true; }
    btn.style.display=show?'flex':'none'; btn.textContent=me.spy?'방해':'액션';
  } else btn.style.display='none';
  renderer.render(scene,camera);
}
let last=performance.now();
function loop(now){ requestAnimationFrame(loop); let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05; step(dt); render(); }
requestAnimationFrame(loop);

// ---- 라운드 시작 ----
function clearPlayerMeshes(){ for(const p of S.players){ if(p.mesh) scene.remove(p.mesh); if(p.ring) scene.remove(p.ring); if(p.label) scene.remove(p.label); } }
function startRound(){
  clearPlayerMeshes(); S.players=[];
  for(let i=0;i<wantCount;i++){ const p={id:i,isBot:i!==0,name:i===0?'나':NAMES[i%NAMES.length],color:PASTEL[i%PASTEL.length],x:0,z:0,ivx:0,ivz:0,role:'runner',spy:false,alive:true,jailed:false,jailT:0,invuln:0,face:0,botTimer:0,botTarget:null}; S.players.push(p); }
  S.myId=0; resetSwitches(); assignRoles();
  for(const p of S.players){ p.mesh=makeChar(p.color,p.role==='hunter'); scene.add(p.mesh);
    p.label=makeLabel(p.name + (p.id===S.myId&&p.spy?' 🕵️':''),4.4); p.label.renderOrder=6; scene.add(p.label);
    if(p.id===S.myId){ p.ring=new THREE.Mesh(new THREE.RingGeometry(0.62,0.82,24), new THREE.MeshBasicMaterial({color:0xffe08a,side:THREE.DoubleSide,transparent:true,opacity:0.9})); p.ring.rotation.x=-Math.PI/2; scene.add(p.ring); } }
  S.time=S.dur; S.phase='play'; S.missionActive=false; S.missionDone=false; S.freezeT=0; S.winner=null; pdLines=[]; pdLogEl.innerHTML='';
  const me=S.players[S.myId]; const rc=document.getElementById('roleCard');
  if(me.role==='hunter'){ rc.textContent='나의 역할: 👹 헌터 — 도망자를 모두 잡아라!'; rc.style.background='rgba(120,40,40,.85)'; }
  else if(me.spy){ rc.textContent='나의 역할: 🕵️ 스파이 — 도망자인 척, 몰래 미션 방해!'; rc.style.background='rgba(90,60,120,.9)'; }
  else { rc.textContent='나의 역할: 🏃 도망자 — 잡히지 말고 살아남아라!'; rc.style.background='rgba(30,70,120,.85)'; }
  document.getElementById('splash').style.display='none'; document.getElementById('result').style.display='none';
  pdBig('🎬 게임 시작!', me.role==='hunter'?'너는 헌터다':(me.spy?'너는 스파이다 (비밀!)':'살아남아라!')); pdLog('라운드 시작 — 인원 '+wantCount+'명');
}

// ---- 메뉴 ----
document.getElementById('help').innerHTML = ('ontouchstart' in window)
  ? '👈 왼쪽 드래그로 이동 · 👉 오른쪽 드래그로 시점(상하좌우) 회전<br>🟡 <b>액션</b> 버튼: 미션 포인트 작동 · 갇힌 동료 구출<br>🏠 상점에 들어가 숨을 수도 있어요<br>👹 헌터를 피해 제한시간까지 <b>생존</b> · 📋 팀 미션 성공 → 헌터 정지<br>🕵️ 스파이면 몰래 미션을 <b>방해</b>!'
  : '⌨️ WASD/화살표 이동 · <b>Space</b> 액션 · 드래그(또는 Q/E·R/F)로 시점 상하좌우 회전<br>🟡 액션: 미션 포인트 작동 · 갇힌 동료 구출 · 🏠 상점에 숨기<br>👹 헌터를 피해 제한시간까지 <b>생존</b> · 📋 팀 미션 성공 → 헌터 정지<br>🕵️ 스파이면 몰래 미션을 <b>방해</b>!';
document.querySelectorAll('.choice').forEach(c=>c.addEventListener('click',()=>{ document.querySelectorAll('.choice').forEach(x=>x.classList.remove('on')); c.classList.add('on'); pref=c.dataset.pref; }));
document.getElementById('pMinus').addEventListener('click',()=>{ wantCount=Math.max(3,wantCount-1); document.getElementById('pCount').textContent=wantCount; });
document.getElementById('pPlus').addEventListener('click',()=>{ wantCount=Math.min(10,wantCount+1); document.getElementById('pCount').textContent=wantCount; });
document.getElementById('playBtn').addEventListener('click',startRound);
document.getElementById('againBtn').addEventListener('click',startRound);
window.__loaded=true; const pb=document.getElementById('playBtn'); pb.disabled=false; pb.textContent='시작하기';
window.__dbg=()=>({phase:S.phase,time:+S.time.toFixed(1),camYaw:+camYaw.toFixed(2),camPitch:+camPitch.toFixed(2),me:S.players[S.myId]&&{role:S.players[S.myId].role,spy:S.players[S.myId].spy,alive:S.players[S.myId].alive,jailed:S.players[S.myId].jailed,x:+S.players[S.myId].x.toFixed(2),z:+S.players[S.myId].z.toFixed(2)},alive:S.players.filter(p=>p.alive&&p.role==='runner').length,hunters:S.players.filter(p=>p.role==='hunter').length,switches:switches.map(s=>s.on),freeze:+S.freezeT.toFixed(1),winner:S.winner});
</script>
